/*
 * :fabric -- Fabric implementation of the platform SPI.
 *
 * Minecraft is unobfuscated from 26.x onward, so Loom resolves intermediary 0.0.0, there is no mapping
 * set to declare, and dependencies use plain `implementation` rather than `modImplementation`. The
 * classes this compiles against are the same official Mojang names :common and :neoforge see.
 */
plugins {
    id 'net.fabricmc.fabric-loom'
}

base {
    archivesName = "ae2-refabricated-fabric"
}

// Declared here rather than inherited: under PREFER_PROJECT a project that declares any repository
// stops seeing the settings ones, and Loom always declares some.
repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenLocal()
    mavenCentral()
}

final commonMain = project(':common').sourceSets.main

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Fabric's common energy API -- what NeoForge's energy capability is to NeoForge -- so other mods' chargers
    // and generators can reach AE2's. Bundled inside AE2's jar: it is 24 KB, and a player should not have to
    // install it separately for AE2's items to charge.
    implementation "teamreborn:energy:${project.team_reborn_energy_version}"
    include "teamreborn:energy:${project.team_reborn_energy_version}"

    compileOnly project(':common')
    compileOnly "org.jetbrains:annotations:${project.jetbrains_annotations_version}"
}

sourceSets {
    main {
        compileClasspath += commonMain.output
        runtimeClasspath += commonMain.output

        // The shared assets and data are pulled through this project's own processResources rather
        // than copied straight out of :common, so that the exclusions below apply in a dev run as
        // well as in the jar. :common's *classes* still come from its output.
        resources.srcDir project(':common').file('src/main/resources')
        resources.srcDir project(':common').file('src/generated/resources')
    }
    // Client game tests. Kept out of `main` so the test entrypoint and its fabric.mod.json never ship
    // in the published jar; it loads as a second, dev-only mod alongside ae2.
    gametest {
        compileClasspath += main.output + main.compileClasspath + commonMain.output
        runtimeClasspath += main.output + main.runtimeClasspath + commonMain.output
    }
}

tasks.named('compileJava') { dependsOn ':common:classes' }
tasks.named('compileGametestJava') { dependsOn ':common:classes' }

// Dev-only. In a packaged jar :common's classes and resources are merged into this one (see the jar
// task below), but in a dev run they sit in their own build directories, and Fabric Loader only scans
// the directory that holds fabric.mod.json. Grouping the paths tells the loader they are all one mod,
// which is what gets AE2's models, textures, recipes and tags loaded at all: without it the mod
// registers its items and then has no resource pack and no data pack behind them. The loader splits
// this on the path separator, and on a doubled separator between groups.
final ae2ModPaths = files(
        sourceSets.main.output.classesDirs,
        sourceSets.main.output.resourcesDir,
        commonMain.output.classesDirs,
).files.collect { it.absolutePath }.join(File.pathSeparator)

loom {
    runs {
        configureEach {
            property 'fabric.classPathGroups', ae2ModPaths
        }
        client {
            client()
            runDir = 'run'
            property 'appeng.tests', 'true'
            property 'guideme.ae2.guide.sources', rootProject.file('guidebook').absolutePath
        }
        server {
            server()
            runDir = 'run-server'
            programArgs '--nogui'
        }
        // Boots a client, creates a singleplayer world and asserts what AE2 registered. Creating the
        // world is the point: it starts the integrated server, which is the only thing that loads
        // AE2's recipes, tags and loot tables, none of which a client on the title screen ever reads.
        clientGametest {
            client()
            source sourceSets.gametest
            runDir = 'run-gametest'
            property 'fabric.client.gametest'
            property 'appeng.tests', 'true'
        }
    }
}

// The loader-agnostic classes ship inside this jar, exactly as they do in the NeoForge one -- :common
// is never published as a standalone artifact. Its resources are not taken from here: they come in
// through processResources, which is what applies the exclusions.
tasks.named('jar', Jar) {
    from(commonMain.output.classesDirs)
    from(rootProject.file('guidebook')) {
        into 'assets/ae2/ae2guide'
    }
    exclude '/.cache'
}

processResources {
    final props = [
            version               : project.version,
            minecraft_version     : project.minecraft_version,
            fabric_loader_version : project.fabric_loader_version,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }

    // Quartz glass and vibrant quartz glass are drawn by AE2's own connected-texture model type,
    // ae2:quartz_glass, which is NeoForge client code (QuartzGlassModel) and not registered on Fabric.
    // Left alone, both render as the missing-model cube once placed. Until that model is ported (stage 7),
    // point them at a static model of what an isolated block looks like on NeoForge: the glass with its
    // full frame. Neighbouring blocks do not join up yet.
    filesMatching(['assets/ae2/blockstates/quartz_glass.json', 'assets/ae2/blockstates/quartz_vibrant_glass.json']) {
        filter { String line ->
            line.replace('"type": "ae2:quartz_glass"', '"model": "ae2:block/quartz_glass"')
        }
    }

    // AE2's data pack ships in pieces, because the kinds of data fail differently when they name
    // content Fabric has not registered yet.
    //
    // Recipes are forgiving: an unparseable one is logged and skipped, so shipping them costs nothing
    // and 148 of AE2's recipes work today. The rest name recipe serializers that are not registered
    // yet and skip themselves until they are.
    //
    // Everything below is not forgiving. Tags, worldgen and the dynamic registries are loaded through
    // RegistryDataLoader, where one dangling reference is fatal -- "Failed to load registries due to
    // errors" -- and world creation aborts. Verified rather than assumed: lifting these crashes the
    // client gametest on ae2:meteorite_compass, which AECommonItems lists as not yet portable, and on
    // the vanilla enchantable/* tags AE2 contributes to.
    //
    // Drop each line as the content it names registers.
    exclude 'data/minecraft/**'      // contributions to vanilla tags
    exclude 'data/ae2/tags/**'
    exclude 'data/ae2/worldgen/**'
    exclude 'data/ae2/dimension_type/**'
    exclude 'data/ae2/damage_type/**'
    exclude 'data/ae2/loot_table/**'  // names blocks that are not registered
    exclude 'data/ae2/advancement/**'
    exclude 'data/ae2/trade_set/**'
    exclude 'data/ae2/villager_trade/**'

    // Only ever produced by the NeoForge datagen run
    exclude '.cache/**'
}

// AE2's generated data carries NeoForge load conditions -- 67 matter-cannon ammo recipes that should
// only load when another mod supplies the tag they are keyed on ("c:nuggets/barium" and friends).
// Fabric has the same concept under a different key and vocabulary, so the data is translated on the
// way into this jar rather than being generated twice.
//
//   {"neoforge:conditions":[{"type":"neoforge:not",
//                            "value":{"type":"neoforge:tag_empty","tag":"c:nuggets/barium"}}]}
//   {"fabric:load_conditions":[{"condition":"fabric:tags_populated","values":["c:nuggets/barium"]}]}
//
tasks.named('processResources') {
    final translated = layout.buildDirectory.dir('resources/main').get().asFile
    doLast {
        final slurper = new groovy.json.JsonSlurper()
        var rewritten = 0

        // Deliberately narrow: it understands exactly the shapes AE2 emits and throws on anything
        // else. Dropping a condition it did not understand would silently load a recipe whose
        // ingredient tag is empty, which is the failure this mechanism exists to prevent.
        final translate = { Object condition, File source ->
            if (condition instanceof Map && condition.type == 'neoforge:not') {
                final inner = condition.value
                if (inner instanceof Map && inner.type == 'neoforge:tag_empty' && inner.tag) {
                    // not(tag_empty(t)) is exactly "that tag has entries"
                    return ['condition': 'fabric:tags_populated', 'values': [inner.tag]]
                }
            }
            throw new GradleException(
                    "No Fabric translation for the load condition " +
                    groovy.json.JsonOutput.toJson(condition) + " in " + source + ". Add one to the " +
                    "translate closure in fabric/build.gradle -- do not drop it, or the recipe will " +
                    "load with an empty ingredient tag.")
        }

        translated.eachFileRecurse(groovy.io.FileType.FILES) { file ->
            if (!file.name.endsWith('.json')) return
            final text = file.text
            if (!text.contains('neoforge:conditions')) return

            final json = slurper.parseText(text)
            if (!(json instanceof Map) || !json['neoforge:conditions']) return

            final conditions = json.remove('neoforge:conditions').collect { translate(it, file) }
            // Rebuild with the Fabric key first, where the NeoForge one was.
            final out = new LinkedHashMap()
            out['fabric:load_conditions'] = conditions
            out.putAll(json)
            file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(out)) + '\n'
            rewritten++
        }

        if (rewritten > 0) {
            logger.lifecycle("Translated NeoForge load conditions to Fabric in ${rewritten} data file(s)")
        }
    }
}
