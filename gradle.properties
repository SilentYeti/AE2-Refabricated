org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.warning.mode=all

java_version=25

#########################################################
# Minecraft Versions                                    #
#########################################################
minecraft_version=26.2
# Used by :common for its vanilla-only (NeoForm) compile classpath
neoform_version=26.2-2
jetbrains_annotations_version=26.0.2
# https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.2.0.81
neoforge_version_range=[26.2.0.0,)

#########################################################
# Provided APIs                                         #
#########################################################
# Ported to 26.2 alongside AE2 and published to mavenLocal; see guideme-26.2-port.patch
guideme_version=26.2.0-ae2port

#########################################################
# Fabric (:fabric)                                      #
#########################################################
# Minecraft is unobfuscated from 26.x onward, so Loom resolves intermediary 0.0.0 and there is no
# mapping set to declare; :fabric compiles against the same official names as :common and :neoforge.
fabric_loader_version=0.19.3
fabric_api_version=0.157.0+26.2
jei_version=29.5.0.26
jei_minecraft_version=26.1.2
emi_version=1.1.19+1.21.1
jade_version_range=[26.0.0,)
rei_version=21.9.812
wthit_version=19.0.1
jade_file_id=7938398
curios_version=15.0.0-beta.2+26.1.2
athena_version=4.7.3
athena_file_id=7970442

#
# Enable athena at runtime
runtime_athena=false

# Pick which item list mod gets picked at runtime in dev
# Available options: emi, rei, jei, none
# 26.2: jei 29.5.0.26 targets minecraft [26.1,26.1.2] and emi/rei are older still, so none of the three
# can load. Switch back once one of them ships a 26.2 build.
runtime_itemlist_mod=none

# Set to wthit, jade or none to pick which tooltip mod gets picked at runtime
# for the dev environment.
# 26.2: the pinned jade and wthit builds are 26.1-only.
runtime_tooltip_mod=none

# Set to true to use Curio at runtime
runtime_curio=false

#########################################################
# Third party dependencies
#########################################################
snakeyaml_version=1.33
directory_watcher_version=0.17.1
junit_version=5.10.2
flatbuffers_version=23.5.26
ffmpeg_version=6.0-1.5.9
assertj_version=3.26.0
mockito_version=5.21.0

#########################################################
# Gradle                                                #
#########################################################

# Temp fix for Spotless / Remove Unused Imports:
# https://github.com/diffplug/spotless/issues/834
org.gradle.jvmargs=--add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
