/*
 * :common -- loader-agnostic code and the platform SPI.
 *
 * Compiled against vanilla Minecraft only, via ModDevGradle's NeoForm mode. Nothing here may import
 * net.neoforged.* or any loader-specific API; anything that needs one goes behind an interface in
 * appeng.platform and is implemented in :neoforge and :fabric.
 *
 * Because Minecraft is unobfuscated from 26.x onward, the class and member names this compiles
 * against are byte-for-byte the ones both loaders see, so no remapping is involved.
 */
plugins {
    id 'net.neoforged.moddev'
}

neoForge.enable {
    // Vanilla-only: no NeoForge on the classpath at all.
    neoFormVersion = project.neoform_version
}

// Datagen output. It used to live in :neoforge, which meant the Fabric jar shipped none of AE2's
// recipes, tags, loot tables or advancements -- and none of its item models either, since the item
// model definitions under assets/ae2/items are generated too. It is loader-agnostic data, so it
// belongs here and ships in both jars. `:neoforge:runData` still writes it (see its --output).
sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    compileOnly "org.jetbrains:annotations:${project.jetbrains_annotations_version}"
}
